<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗案内 - プラッス ドゥ ニナ 南熊本店</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       ヘッダー固有スタイル
    ========================================== */
    header::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px solid rgba(200, 162, 97, 0.3);
      border-radius: 4px;
      pointer-events: none;
    }

    /* ==========================================
       店舗案内 固有スタイル
    ========================================== */
    .info-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(35, 22, 16, 0.04);
    }

    .info-list {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .info-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-item dt {
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.05em;
    }

    .info-item dd {
      margin: 0;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Googleマップボタン */
    .map-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #f7f3ed;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--wood-dark);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .map-btn:hover {
      background-color: #ebdcd0;
    }

    /* 電話番号リンク */
    .tel-link {
      color: var(--wood-dark);
      text-decoration: none;
      font-weight: bold;
    }
