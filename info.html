<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗案内 - プラッス ドゥ ニナ 南熊本店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       共通変数・ベーススタイル
    ========================================== */
    :root {
      --wood-dark: #231610;
      --wood-medium: #4a3222;
      --accent-gold: #c8a261;
      --gold-light: #e6cb96;
      --bg-color: #f7f4ee;
      --card-bg: #ffffff;
      --text-main: #2b2019;
      --text-sub: #78695f;
      --border-color: #e5dac9;
      
      --font-sans: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-script: 'Great Vibes', cursive;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      padding-bottom: 60px;
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      width: 100%;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(180deg, #1b100a 0%, var(--wood-dark) 100%);
      color: #ffffff;
      padding: 24px 20px 20px;
      text-align: center;
      border-bottom: 3px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 1px solid rgba(200, 162, 97, 0.3);
      border-radius: 4px;
      pointer-events: none;
    }

    .header-logo {
      font-family: var(--font-script);
      font-size: 2.2rem;
      color: var(--gold-light);
      line-height: 1;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      text-decoration: none;
      display: inline-block;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.1em;
    }

    main {
      flex: 1;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    /* ==========================================
       店舗案内 固有スタイル
    ========================================== */
    .info-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(35, 22, 16, 0.04);
    }

    .info-list {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .info-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-item dt {
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.05em;
    }

    .info-item dd {
      margin: 0;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Googleマップボタン */
    .map-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #f7f3ed;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--wood-dark);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .map-btn:hover {
      background-color: #ebdcd0;
    }

    /* 電話番号リンク */
    .tel-link {
      color: var(--wood-dark);
      text-decoration: none;
      font-weight: bold;
    }

    /* 戻るボタン */
    .back-btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 24px;
      padding: 12px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--wood-dark);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .back-btn:active {
      background-color: #f7f3ed;
      transform: translateY(1px);
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 24px 15px;
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">Place de Nina</div>
    <h1>店舗案内</h1>
  </header>

  <main>

    <div class="info-card">
      <dl class="info-list">
        <div class="info-item">
          <dt>店名</dt>
          <dd>プラッス ドゥ ニナ 南熊本店</dd>
        </div>

       <div class="info-item">
          <dt>住所</dt>
          <dd>
            〒862-0962<br>
            熊本県熊本市南区田迎4丁目9-36<br>
            <a href="https://www.google.com/maps/search/?api=1&query=熊本県熊本市南区田迎4丁目9-36" target="_blank" rel="noopener noreferrer" class="map-btn">
              📍 Googleマップで開く
            </a>
          </dd>
        </div>
        
        <div class="info-item">
          <dt>営業時間</dt>
          <dd>11:00 〜 17:00</dd>
        </div>

        <div class="info-item">
          <dt>定休日</dt>
          <dd>水・土日祝</dd>
        </div>

        <div class="info-item">
          <dt>電話番号</dt>
          <dd><a href="tel:096-284-1927" class="tel-link">096-284-1927</a></dd>
        </div>

        <div class="info-item">
          <dt>アクセス</dt>
          <dd>JR南熊本駅より徒歩20分 / 駐車場2台あり</dd>
        </div>
      </dl>
    </div>

    <!-- 戻るボタン -->
    <a href="index.html" class="back-btn">
      ‹ トップページへ戻る
    </a>

  </main>

  <footer>
    &copy; PLACE DE NINA MINAMIKUMAMOTO
  </footer>

</body>
</html>
