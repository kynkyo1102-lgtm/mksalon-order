<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ふしぎな けいさんタウン | ゲーム風UIプレビュー</title><link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer}a{color:inherit}
body{--accent:#f5d98d;--bg:#101d39;--panel:#15294d;--border:#a6c8ee;--txt:#f8f7ef;background:var(--bg);color:var(--txt)}
body.ff{--accent:#bdeaff;--bg:#071333;--panel:#102c86;--border:#d5e9ff}
body.persona{--accent:#ffdf32;--bg:#111;--panel:#ec2638;--border:#fff}
body.mother{--accent:#ffef7d;--bg:#413a91;--panel:#d959a2;--border:#fff6db}
body.octo{--accent:#f7d88b;--bg:#151d29;--panel:#19283a;--border:#d8b16a}
.scene{min-height:100dvh;position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:50px 18px 92px;overflow:hidden;background:radial-gradient(ellipse at 50% 24%,#254b86,var(--bg) 68%)}
.ff .scene:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 50% 25%,#a3dfff55,transparent 24%),repeating-linear-gradient(0deg,transparent 0 32px,#a9d7ff10 33px 34px)}
.persona .scene{background:repeating-linear-gradient(155deg,#101010 0 50px,#242424 50px 85px,#e92b3d 85px 104px,#101010 104px 190px)}
.mother .scene{background:repeating-radial-gradient(ellipse at 50% 40%,#6545b2 0 32px,#403b96 32px 70px,#a24698 70px 88px,#403b96 88px 130px)}
.octo .scene{background:radial-gradient(ellipse at 50% 15%,#655033 0%,#243144 40%,#101824 82%)}.octo .scene:before{content:"";position:absolute;z-index:-1;inset:0;background:repeating-linear-gradient(90deg,transparent 0 75px,#d1a85c09 76px 78px)}
.preview{position:fixed;top:9px;left:10px;z-index:20;font-size:11px;padding:5px 9px;background:#070b17cb;border:1px solid #ffffff66}
.heading,.menu,.dialog{width:min(560px,100%);position:relative}.heading{text-align:center;padding:17px 12px}.eyebrow{font:12px "DotGothic16",monospace;letter-spacing:.16em;color:var(--accent)}h1{font-size:clamp(25px,7vw,38px);line-height:1.3;margin:9px 0;font-weight:900} .subtitle{font-size:12px;margin:0;opacity:.88}
.menu{padding:18px 17px}.menu-label{font-size:13px;letter-spacing:.08em;margin:0 0 13px;color:var(--accent)}.options{display:grid;gap:12px}.option{width:100%;position:relative;display:flex;align-items:center;text-align:left;gap:13px;min-height:102px;padding:14px 15px;border:2px solid var(--border);background:var(--panel);color:var(--txt);transition:transform .12s,filter .12s,box-shadow .12s}.option:active,.option.pressed{transform:translate(2px,4px)!important}.option:hover,.option:focus-visible,.option.chosen{filter:brightness(1.15);outline:2px solid var(--accent);outline-offset:2px}.icon{font-size:29px;color:var(--accent);width:36px;text-align:center;flex:none}.optname{display:block;font-size:19px;font-weight:900;line-height:1.25}.optjp{display:block;font-size:12px;margin-top:7px;opacity:.85}.arrow{margin-left:auto;color:var(--accent);font-size:23px}.dialog{padding:16px 20px;min-height:104px;font-size:14px;line-height:1.9;white-space:pre-line}.dialog a{color:var(--accent);font-weight:bold}.replay{border:1px solid var(--accent);color:var(--accent);background:#090e20b8;padding:9px 17px;font-size:12px}.back{position:fixed;left:12px;bottom:14px;font-size:11px;text-decoration:none;z-index:15}.robot{position:fixed;right:12px;bottom:12px;z-index:15;background:var(--panel);border:2px solid var(--border);color:var(--accent);padding:7px 12px;font:13px "DotGothic16",monospace;box-shadow:3px 4px #0007}
.ff .heading,.ff .menu,.ff .dialog{background:linear-gradient(135deg,#2c60c3,#12266b 55%,#071448);border:3px solid #e4f4ff;border-radius:9px;box-shadow:inset 0 0 0 3px #90baff,0 7px 0 #050e2c,0 0 24px #a6dbff22}.ff h1{font-family:"DotGothic16",monospace;text-shadow:0 0 16px #bdeaffaa}.ff .option{background:linear-gradient(120deg,#2149ac,#07195a);border-radius:7px;box-shadow:inset 0 0 0 2px #749ce2}.ff .icon{text-shadow:0 0 18px #bdeaff}
.persona .heading{transform:rotate(-3deg);background:#f5f5f5;color:#101010;box-shadow:10px 10px #e92537}.persona .heading .eyebrow{color:#c00}.persona .menu{background:#0b0b0b;border:5px solid white;transform:skewY(-2deg);box-shadow:12px 12px #e92537}.persona .menu>*{transform:skewY(2deg)}.persona .option{background:#ed263a;color:#fff;border:3px solid #fff;clip-path:polygon(0 0,97% 0,100% 75%,94% 100%,0 100%,3% 25%);box-shadow:5px 5px #000}.persona .option:nth-child(2){background:#fff;color:#151515}.persona .option:nth-child(2) .icon,.persona .option:nth-child(2) .arrow{color:#e92537}.persona .optname{font-style:italic;font-size:23px;letter-spacing:-.04em}.persona .dialog{background:#fff;color:#121212;border-left:14px solid #e92537;transform:rotate(1deg);font-weight:700}.persona .dialog a{color:#c82035}
.mother .heading,.mother .menu,.mother .dialog{background:linear-gradient(135deg,#ec71b1,#bc438d);border:5px solid #fff5d2;border-radius:25px;box-shadow:inset 0 0 0 4px #6b2c85,0 9px 0 #271954,0 0 20px #f0c3ff55}.mother h1{font-family:"DotGothic16",monospace}.mother .option{border:4px solid #fff4cc;border-radius:19px;background:#4a409b;box-shadow:inset 0 0 0 3px #8d7fce,4px 5px #301c6c}.mother .optname{font-family:"DotGothic16",monospace}.mother .icon{font-size:26px}
.octo .heading,.octo .menu,.octo .dialog{background:linear-gradient(140deg,#273a4e,#111c2d);border:5px solid transparent;border-image:linear-gradient(135deg,#fff1b9,#a77531 25%,#f5d990 46%,#6e4c27 66%,#e6be6e 90%,#fff3c4) 1;box-shadow:inset 0 0 0 2px #675338,0 10px 0 #080e17,0 18px 38px #0008}.octo h1{font-family:serif;font-weight:700;letter-spacing:.12em;color:#f6e3ad;text-shadow:0 3px #101010,0 0 15px #d9ad5366}.octo .option{background:linear-gradient(145deg,#253b54,#101d2e);border:4px solid transparent;border-image:linear-gradient(140deg,#fff1b9,#b88c45 25%,#f5da93 46%,#73552d 66%,#e6c077 90%) 1;box-shadow:inset 0 0 20px #d5ad5c18}.octo .icon{text-shadow:0 0 12px #f6d88b}
.loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:var(--bg);transition:opacity .35s,visibility .35s}.loading.hidden{opacity:0;visibility:hidden;pointer-events:none}.loadbox{width:min(490px,100%);text-align:center;padding:30px 22px;background:var(--panel);border:4px solid var(--border);box-shadow:inset 0 0 0 3px #ffffff22,0 10px 35px #0008}.loadbox h2{font-size:27px;color:var(--accent);margin:0 0 12px}.loadbox p{font-size:13px;margin:0 0 20px}.track{height:26px;border:3px solid var(--border);padding:3px;background:#07102b}.fill{height:100%;width:0;background:linear-gradient(180deg,#fff4ca,var(--accent) 50%,#a47b38);transition:width .1s steps(2,end)}.pct{font-size:12px;color:var(--accent);margin-top:10px}
.persona .loadbox{transform:rotate(-2deg);border:6px solid white;box-shadow:12px 12px #e92537}.persona .fill{background:repeating-linear-gradient(90deg,#fff 0 20px,#e92537 20px 28px)}.mother .loadbox{border-radius:25px;border:5px solid #fff6d3;box-shadow:inset 0 0 0 4px #7b398b}.mother .fill{background:repeating-linear-gradient(90deg,#ffec83 0 16px,#ff9dbd 16px 23px)}.octo .loadbox{border:5px solid #d9b66b;box-shadow:inset 0 0 0 2px #a5793c,0 10px 35px #0008}
@media(max-width:420px){.scene{padding:40px 12px 85px;gap:10px}.heading{padding:10px}.heading h1{font-size:24px;margin:5px 0}.menu{padding:12px}.options{gap:9px}.option{min-height:82px;padding:9px}.optname{font-size:16px}.persona .optname{font-size:19px}.dialog{min-height:85px;padding:11px 13px;font-size:12px}.robot{padding:5px 8px;font-size:11px}}
@media(max-height:730px) and (max-width:680px){.scene{justify-content:flex-start;padding-top:36px;gap:9px}.heading{padding:9px}.heading h1{margin:3px 0;font-size:23px}.menu{padding:10px}.menu-label{margin-bottom:7px}.option{min-height:75px;padding:8px}.options{gap:7px}.dialog{min-height:75px;padding:9px 12px;font-size:12px}.replay{padding:5px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body class="mother"><div class="preview">お試しプレビュー／本番は変更なし</div><div class="scene"><header class="heading"><div class="eyebrow">ODD LITTLE QUEST</div><h1>ふしぎな けいさんタウン</h1><p class="subtitle">さて、きょうは なにを しよう？</p></header><main class="menu"><p class="menu-label">✿ SELECT YOUR MODE</p><div class="options"><button class="option" data-url="calc_pt.html" data-name="ポイントを さがす"><span class="icon">✿</span><span><span class="optname">ポイントを さがす</span><span class="optjp">ぴったりの くみあわせ</span></span><span class="arrow">›</span></button><button class="option" data-url="calc_split.html" data-name="ポイントを わける"><span class="icon">◇</span><span><span class="optname">ポイントを わける</span><span class="optjp">うまく ふりわける</span></span><span class="arrow">›</span></button></div></main><section class="dialog" id="dialog" aria-live="polite">こんにちは！ ここは けいさんタウン。<br>きょうの ようじは なあに？</section><button class="replay" id="replay">↻ ローディングからもう一度</button><a class="back" href="index.html">← ホームへ</a><button class="robot" id="robot">▣ GUIDE</button></div><div class="loading" id="loading" role="status"><div class="loadbox"><h2>LOADING...</h2><p>まちの じゅんびを しています…</p><div class="track"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div></div><script>
(()=>{const loading=document.getElementById("loading"),fill=document.getElementById("fill"),pct=document.getElementById("pct"),dialog=document.getElementById("dialog");let timer,busy=false;
function boot(){clearInterval(timer);loading.classList.remove("hidden");let n=0;fill.style.width="0%";pct.textContent="0%";timer=setInterval(()=>{n=Math.min(100,n+5);fill.style.width=n+"%";pct.textContent=n+"%";if(n===100){clearInterval(timer);setTimeout(()=>loading.classList.add("hidden"),300)}},105)}
document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{if(busy)return;busy=true;b.classList.add("pressed","chosen");dialog.textContent="おっ！ えらんだのは "+b.dataset.name+"！";setTimeout(()=>{b.classList.remove("pressed");dialog.innerHTML="おっ！ えらんだのは "+b.dataset.name+"！<br><a href='"+b.dataset.url+"'>本物のツールへ進む ›</a><br><small>※プレビューなので自動移動しません</small>";busy=false},340)}));
document.getElementById("robot").addEventListener("click",()=>{dialog.textContent="GUIDE：目標ポイントなら POINT QUEST。\nポイントを分けるなら BLOCK BALANCE！"});
document.getElementById("replay").addEventListener("click",()=>{dialog.textContent="こんにちは！ ここは けいさんタウン。 きょうの ようじは なあに？";document.querySelectorAll(".option").forEach(b=>b.classList.remove("chosen"));boot()});boot()})();
</script></body></html>
