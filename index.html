  <script>
    async function loadNews() {
      try {
        const res = await fetch('./month_config.json?v=' + Date.now());
        const data = await res.json();
        
        const container = document.getElementById('newsContainerArea');
        if (!container) return;

        let items = [];
        if (Array.isArray(data.newsList) && data.newsList.length > 0) {
          items = data.newsList;
        } else if (data.newsDate || data.newsText) {
          items = [{ date: data.newsDate || '', text: data.newsText || '' }];
        }

        if (items.length > 0) {
          const latest = items[0];
          // 最新お知らせ（NEWバッジを追加）
          let html = `
            <div class="news-box">
              <span class="news-date">
                <span class="news-badge">NEW</span>${latest.date}
              </span>
              <p class="news-text">${latest.text}</p>
            </div>
          `;

          // 過去のお知らせ（アコーディオン内・バッジなし）
          if (items.length > 1) {
            const pastItemsHtml = items.slice(1).map(item => `
              <div class="news-box" style="margin-bottom: 10px;">
                <span class="news-date">${item.date}</span>
                <p class="news-text">${item.text}</p>
              </div>
            `).join('');

            html += `
              <details class="news-accordion">
                <summary class="news-summary">
                  <span>📢 過去のお知らせ一覧</span>
                  <span class="news-toggle-icon">▶</span>
                </summary>
                <div class="news-content-body">
                  ${pastItemsHtml}
                </div>
              </details>
            `;
          }

          container.innerHTML = html;
        } else {
          container.innerHTML = '';
        }
      } catch (e) {
        console.error("お知らせの読み込みに失敗しました", e);
      }
    }

    window.addEventListener('DOMContentLoaded', loadNews);
  </script>
