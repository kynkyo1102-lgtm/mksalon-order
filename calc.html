<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文計算アシスタント - Place de Nina</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       共通変数・ベーススタイル
    ========================================== */
    :root {
      --wood-dark: #231610;
      --wood-medium: #4a3222;
      --accent-gold: #c8a261;
      --gold-light: #e6cb96;
      --bg-color: #f7f4ee;
      --card-bg: #ffffff;
      --text-main: #2b2019;
      --text-sub: #78695f;
      --border-color: #e5dac9;
      
      --font-sans: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-script: 'Great Vibes', cursive;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      padding-bottom: 60px;
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      width: 100%;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(180deg, #1b100a 0%, var(--wood-dark) 100%);
      color: #ffffff;
      padding: 24px 20px 20px;
      text-align: center;
      border-bottom: 3px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 1px solid rgba(200, 162, 97, 0.3);
      border-radius: 4px;
      pointer-events: none;
    }

    .header-logo {
      font-family: var(--font-script);
      font-size: 2.2rem;
      color: var(--gold-light);
      line-height: 1;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      text-decoration: none;
      display: inline-block;
    }

    .header-logo:hover {
      opacity: 0.85;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.1em;
    }

    main {
      flex: 1;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    /* ==========================================
       注文計算アシスタント 固有スタイル
    ========================================== */
    .nav-link {
      display: inline-block;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: 500;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .card-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(35, 22, 16, 0.04);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--wood-dark);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .usage-guide {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 0 0 16px 0;
      line-height: 1.4;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px;
      text-decoration: none;
      color: var(--text-main);
      display: block;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(35, 22, 16, 0.03);
    }

    .menu-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(200, 162, 97, 0.15);
      background: linear-gradient(180deg, #ffffff 0%, #fcfaf5 100%);
    }

    .menu-card-title {
      font-size: 0.98rem;
      font-weight: bold;
      color: var(--wood-dark);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-card-title::after {
      content: "›";
      font-size: 1.3rem;
      color: var(--accent-gold);
    }

    .menu-card-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 0;
      line-height: 1.5;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 24px 15px;
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="header-logo">Place de Nina</a>
    <h1>注文計算アシスタント</h1>
  </header>

  <main>
    <a href="index.html" class="nav-link">&lt; ホームに戻る</a>

    <div class="card-box">
      <div class="section-title">利用する機能を選択してください</div>
      <p class="usage-guide">ご希望のサポートツールを選んでください。</p>
      
      <div class="menu-container">
        <!-- 1. 購入PT最適化ページへ -->
        <a href="calc_pt.html" class="menu-card">
          <div class="menu-card-title">1. ポイント最適化シミュレーター</div>
          <p class="menu-card-desc">目標ポイントに最も効率よく到達できる商品の組み合わせを自動計算します。商品の除外や必ず含める個数の指定も可能です。</p>
        </a>

        <!-- 2. 左右バランス分配ページへ -->
        <a href="calc_split.html" class="menu-card">
          <div class="menu-card-title">2. 購入商品のバランス分配</div>
          <p class="menu-card-desc">購入したい商品と個数を指定して、バランスよく商品を振り分けます。目標PTの指定や今あるポイントも合わせた計算もできます。</p>
        </a>
      </div>
    </div>
  </main>

  <footer>
    &copy; Place de Nina Order Support System
  </footer>

</body>
</html>
