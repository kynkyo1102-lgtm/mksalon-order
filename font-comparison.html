<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Place de Nina フォント比較</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:wght@500;600&family=Marcellus&family=DM+Serif+Display&family=Great+Vibes&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#302b28;font-family:"Noto Sans JP",sans-serif}header{padding:20px;background:#315b43;color:white;text-align:center}header h1{font-size:18px;margin:0}main{max-width:720px;margin:auto;padding:24px 16px 60px}.lead{font-size:13px;line-height:1.8;color:#6b6259;margin-bottom:24px}.sample{margin:0 0 18px;background:#315b43;border-radius:15px;padding:20px 18px 22px;color:#fff;box-shadow:0 3px 12px #302b2812}.num{font-size:12px;letter-spacing:.04em;opacity:.85}.brand{margin:18px 0 8px;font-size:clamp(32px,7vw,52px);line-height:1.2;white-space:nowrap;text-align:center}.shop{text-align:center;font-size:12px;letter-spacing:.12em;color:white}.caption{font-size:12px;line-height:1.7;margin:12px 2px 24px;color:#6b6259}.cormorant{font-family:"Cormorant Garamond",serif;font-weight:600}.playfair{font-family:"Playfair Display",serif;font-weight:500}.marcellus{font-family:"Marcellus",serif}.dm{font-family:"DM Serif Display",serif}.current{font-family:"Great Vibes",cursive;font-weight:400}.note{margin-top:24px;font-size:12px;line-height:1.8;color:#6b6259}</style></head><body><header><h1>Place de Nina｜フォント比較</h1></header><main><p class="lead">実際のトップページの深緑ヘッダーを想定して、同じ文字・同じ背景色で並べました。スマホでも比較できます。※このページは比較用で、本番ロゴは変更していません。</p><div id="samples"></div><p class="note">フォントはGoogle Fontsから読み込んでいます。通信状況によって表示まで少し時間がかかる場合があります。</p></main><script>const items=[["01","Cormorant Garamond","cormorant","繊細で優雅。クラシカルなサロンの雰囲気。"],["02","Playfair Display","playfair","メリハリがあり、華やかな印象。"],["03","Marcellus","marcellus","端正で控えめ。木目の内装にも馴染む。"],["04","DM Serif Display","dm","柔らかさのある、印象的なセリフ体。"],["05","Great Vibes（現在の書体）","current","現在の筆記体も比較用に掲載。"]];document.getElementById("samples").innerHTML=items.map(([n,name,cls,desc])=>'<section class="sample"><div class="num">'+n+' — '+name+'</div><div class="brand '+cls+'">Place de Nina</div><div class="shop">南熊本店</div></section><p class="caption">'+desc+'</p>').join("");</script></body></html>
