<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf1;font-family:"Noto Sans JP",system-ui,sans-serif;color:#243345}.toolbar{position:sticky;top:0;z-index:5;background:white;box-shadow:0 2px 12px #172c4420;padding:12px max(14px,calc((100vw - 700px)/2));display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar strong{font-size:14px;margin-right:auto}.toolbar button{font:700 13px inherit;font-weight:700;border:1px solid #b8c9d5;background:white;border-radius:999px;padding:10px 15px;cursor:pointer}.toolbar button[aria-pressed=true]{background:#244d64;color:white;border-color:#244d64}.hint{font-size:11px;color:#64748b;padding:8px 14px;text-align:center}.stage{margin:0 auto;width:min(100%,450px);height:calc(100dvh - 112px);min-height:420px;background:white;box-shadow:0 10px 30px #172c4422}iframe{display:block;border:0;width:100%;height:100%}@media(min-width:700px){.stage{border-radius:22px;overflow:hidden;margin-top:12px;height:min(790px,calc(100dvh - 130px))}}
</style></head><body>
<div class="toolbar"><strong>レトロロボ｜⑧ 左ロボ・右テキスト</strong><span style="font-size:12px;color:#64748b">実ページ上の配置プレビュー</span></div>

<script>
const frame=document.getElementById('site');
const robot='<img src="assets/retro-guide-robot.svg" alt="" style="display:block;width:100%;height:100%;object-fit:contain">';
function apply(){
const doc=frame.contentDocument;if(!doc)return;
const old=doc.querySelector('.home-floating-robot');if(!old)return;
old.style.setProperty('display','none','important');
let style=doc.createElement('style');style.textContent=`
#retro-robot-preview{position:fixed!important;z-index:9999!important;right:12px!important;bottom:18px!important;width:194px!important;height:52px!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;padding:0 17px 0 67px!important;box-sizing:border-box!important;border:2px solid #cbd8e0!important;border-radius:999px!important;background:#fff!important;color:#1d3447!important;text-decoration:none!important;box-shadow:0 5px 14px #20304024!important;font-family:"Noto Sans JP",sans-serif!important}
#retro-robot-preview .robot{position:absolute!important;left:4px!important;bottom:3px!important;width:63px!important;height:72px!important;display:block!important}
#retro-robot-preview .robot img{width:100%!important;height:100%!important;object-fit:contain!important}
#retro-robot-preview .label{font-size:12px!important;font-weight:700!important;white-space:nowrap!important;letter-spacing:-.04em!important;flex:1!important}
#retro-robot-preview .arrow{font-size:22px!important;line-height:1!important;color:#345a70!important;margin-left:7px!important}
#retro-robot-preview:focus-visible{outline:3px solid #2983ad!important;outline-offset:4px!important}
@media(max-width:360px){#retro-robot-preview{right:8px!important;bottom:12px!important}}
`;doc.head.appendChild(style);
const el=doc.createElement('a');el.id='retro-robot-preview';el.href='calc.html';el.setAttribute('aria-label','計算サポートツールを開く');el.innerHTML='<span class="robot">'+robot+'</span><span class="label">計算サポート</span><span class="arrow" aria-hidden="true">›</span>';doc.body.appendChild(el);
}
frame.addEventListener('load',apply);
</script></body></html>
